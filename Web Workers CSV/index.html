<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor CSV con Web Workers</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Visor de archivos CSV</h1>
    <p>El archivo se lee y procesa en un <strong>Web Worker</strong>, sin bloquear la interfaz.</p>
  </header>

  <main>
    <section class="panel">
      <label for="archivo" class="zona-carga" id="zonaCarga">
        <span class="icono">📄</span>
        <span>Haz clic o arrastra aquí un archivo <strong>.csv</strong></span>
        <input type="file" id="archivo" accept=".csv,text/csv">
      </label>

      <div class="opciones">
        <label>
          Separador:
          <select id="separador">
            <option value="auto">Automático</option>
            <option value=",">Coma (,)</option>
            <option value=";">Punto y coma (;)</option>
            <option value="\t">Tabulación</option>
          </select>
        </label>
        <label>
          <input type="checkbox" id="encabezado" checked>
          La primera fila es encabezado
        </label>
        <button type="button" id="contador" title="Prueba que la interfaz sigue respondiendo">
          Clics mientras carga: <span id="clics">0</span>
        </button>
      </div>

      <div class="progreso" id="progresoCont" hidden>
        <div class="barra"><div class="relleno" id="relleno"></div></div>
        <span id="progresoTexto">0%</span>
      </div>

      <p id="estado" class="estado">Esperando archivo…</p>
    </section>

    <section class="panel" id="resultado" hidden>
      <div class="resumen" id="resumen"></div>
      <input type="search" id="filtro" placeholder="Filtrar filas…">
      <div class="tabla-cont">
        <table id="tabla">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>Tecnologías Web · Web Workers</footer>

  <script src="js/main.js"></script>
</body>
</html>
